[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metrotrip-backend"
version = "0.1.0"
description = "MetroTrip REST API server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "apscheduler>=3.10",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "oracledb>=2.4",
    "pymysql>=1.1",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
