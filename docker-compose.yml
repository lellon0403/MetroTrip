# 배포 서버용. DB는 컨테이너로 안 띄운다 — 외부 PC나 클라우드(현재 Aiven,
# backend/.env.example 참고)에 이미 구축된 MySQL에 api가 METROTRIP_DATABASE_URL로
# 접속한다. 조회 폴백용 Oracle도 마찬가지로 외부 접속이다 (docs/DB-FAILOVER.md).
#
# 이미지는 GitHub Actions(.github/workflows/cd-main.yml)가 main 푸시마다 빌드해서
# `<네임스페이스>/metrotrip-backend:main`처럼 `main` 태그로 Docker Hub에 push한다(커밋
# SHA 태그도 같이 올라가지만 이 파일은 `main` 고정 태그를 pull한다). 그래서 각 서비스에
# `image:`와 `build:`를 같이 뒀다 — 용도가 다르다.
#   - 배포 서버: `docker compose pull && docker compose up -d` — `image:`가 가리키는
#     Docker Hub 태그를 그대로 받아온다. 서버에서 직접 빌드하지 않는다.
#   - 로컬/다른 PC에서 미리 검증할 때: `docker compose up -d --build` — `build:`
#     컨텍스트로 그 자리에서 빌드한다(2026-08-11에 이렇게 실제로 검증했다, docs/CICD.md 5장).
# `DOCKERHUB_NAMESPACE`는 .env(비어 있으면 fallback으로 `metrotrip`을 씀 — 실제 배포 시엔
# 반드시 .env에서 cd-main.yml이 push하는 것과 같은 네임스페이스로 채워야 한다)로 결정한다.
#
# 서비스 이름을 `api`로 한 건 취향이 아니라 강제다 — frontend/Dockerfile의
# API_INTERNAL_BASE_URL 기본값이 `http://api:8000`으로 박혀 있어서, 백엔드 서비스
# 이름을 이걸로 맞추지 않으면 frontend 컨테이너가 백엔드를 못 찾는다.
#
# 실행 전 준비물 (배포 서버에서, 저장소는 커밋하지 않음):
#   - 이 파일과 같은 위치에 .env 작성 (.env.example 참고) — DOCKERHUB_NAMESPACE,
#     METROTRIP_* 값 전부. NEXT_PUBLIC_KAKAO_JS_KEY는 여기선 안 쓴다 — 이미 CD가 이미지
#     빌드 시점에 박아 넣었으므로 서버에서 다시 넘겨도 소용없다(5장 참고).
#   - backend/certs/ca.pem — 외부 MySQL이 SSL 인증서를 요구할 때만 필요.
#     .gitignore에 걸려 있어 저장소로는 안 오므로 배포 서버에 직접 올려둬야 한다.
#     안 쓰면 아래 api.volumes의 certs 줄과 .env의 METROTRIP_SSL_CA_PATH를 비워둔다.
#   - Oracle 지갑(METROTRIP_ORACLE_WALLET_DIR)도 준비되면 certs와 같은 방식으로
#     배포 서버에 올려두고 볼륨 마운트를 추가한다 (아직 지갑 파일 자체가 없어 보류 중).
#
# 실제 배포 서버에서 `docker compose pull`로 검증한 적은 아직 없다 — 저장소 Secrets/
# Variables를 설정하고 cd-main.yml이 최소 한 번 push에 성공한 뒤 확인해야 한다.
# docs/CICD.md 4·7장 참고.

services:
  api:
    image: ${DOCKERHUB_NAMESPACE:-metrotrip}/metrotrip-backend:main
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - backend_media:/app/media
      - backend_var:/app/var
      - ./backend/certs:/app/certs:ro

  frontend:
    image: ${DOCKERHUB_NAMESPACE:-metrotrip}/metrotrip-frontend:main
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_KAKAO_JS_KEY: ${NEXT_PUBLIC_KAKAO_JS_KEY}
        # rewrites()가 서버 시작 시 이 값을 읽어 프록시 대상을 정한다(next.config.ts).
        # 빌드 시점엔 안 쓰이지만 Dockerfile의 ARG 이름과 맞춰 헷갈리지 않게 같이 넘긴다.
        API_INTERNAL_BASE_URL: http://api:8000
    restart: unless-stopped
    environment:
      # next start가 뜰 때 이 값으로 next.config.ts의 rewrites 대상을 정한다.
      # Dockerfile 런타임 스테이지 기본값과 같은 값이지만, api 서비스명이 바뀌면
      # 여기만 고치면 되도록 명시해둔다.
      API_INTERNAL_BASE_URL: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  backend_media:
  backend_var:
