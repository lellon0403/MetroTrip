name: metrotrip

services:
  db:
    image: mysql:8.0
    container_name: metrotrip-db
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-metrotrip-root}"
      MYSQL_DATABASE: metrotrip
      MYSQL_USER: "${MYSQL_USER:-metrotrip}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-metrotrip}"
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - metrotrip_mysql_data:/var/lib/mysql
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
      - ../db/schema/mysql:/opt/metrotrip/schema:ro
      - ../db/seed:/opt/metrotrip/seed:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  metrotrip_mysql_data:
    name: metrotrip-mysql-data-utf8
