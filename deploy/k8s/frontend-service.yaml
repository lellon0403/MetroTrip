# 클러스터 내부에서 프론트엔드를 frontend:5173으로 노출한다.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: metrotrip
  labels:
    app.kubernetes.io/name: metrotrip
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: metrotrip
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 5173
      targetPort: http
