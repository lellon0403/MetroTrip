# 클러스터 내부에서 백엔드를 api:8000으로 노출한다.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: metrotrip
  labels:
    app.kubernetes.io/name: metrotrip
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: metrotrip
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
