# 백엔드가 저장하는 사용자 업로드 미디어를 영속화한다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-media
  namespace: metrotrip
  labels:
    app.kubernetes.io/name: metrotrip
    app.kubernetes.io/component: backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
