# 원본: https://github.com/SunMoonUniv/ModuPick/blob/develop/.github/workflows/ci-backend.yml
#
# MetroTrip에 맞게 바꾼 점:
#   - Python 버전을 backend/Dockerfile(python:3.10-slim)과 동일하게 3.10으로 맞췄다.
#   - requirements-dev.txt가 없다. 대신 backend/pyproject.toml의
#     [project.optional-dependencies] dev(pytest, ruff, httpx)로 설치한다.
#   - flake8 대신 프로젝트가 실제로 쓰는 ruff로 린트한다(backend/pyproject.toml [tool.ruff]).
#   - MySQL 서비스 컨테이너와 docker compose를 걷어냈다. backend/tests/*.py는 전부
#     `create_engine("sqlite://")`로 인메모리 DB를 직접 만들어 쓰므로 CI에 실제 MySQL이
#     필요 없다. 다만 app/database.py가 모듈 import 시점에
#     create_engine(settings.database_url)을 호출하고, database_url은
#     pydantic-settings 필수 필드(기본값 없음)라 형식만 맞는 더미 값을 넣어준다 —
#     create_engine 자체는 실제 접속을 시도하지 않는다.
#
# 2026-08-11 재검토: develop에 MySQL/Oracle 이중화(docs/DB-FAILOVER.md)가 들어와
# oracledb·apscheduler가 [project] dependencies에 추가됐다. 둘 다 optional이 아니라
# 기본 의존성이라 `pip install -e ".[dev]"`가 그대로 같이 설치한다. Oracle 관련 설정
# (METROTRIP_ORACLE_*)은 전부 Optional(기본값 None)이라 CI에서 값을 안 줘도 import가
# 깨지지 않는다 — 실제로 이 워크플로우 그대로(ruff + pytest, 더미 MySQL URL만) 로컬에서
# 재검증했고 134개 테스트 전부 통과했다. 그래서 이 파일 자체는 바꿀 게 없었다.
#
# 2026-08-11 브랜치 전략 확정: develop은 CI만, main은 CI + 이미지 빌드/푸시(CD)로 역할을
# 나눴다(docs/CICD.md). 그래서 push 트리거에서 main을 뺐다 — main 푸시는
# `.github/workflows/cd-main.yml`이 자체적으로 test-backend/test-frontend를 인라인해서
# 검증한다(이 파일을 workflow_call로 재사용하지 않는다 — main 파이프라인을 develop CI
# 파일 변경에서 독립시키기 위한 의도적 선택, cd-main.yml 상단 주석 참고). 그래서 여기
# 검증 스텝을 고치면 cd-main.yml의 test-backend 잡도 같이 봐야 한다. PR 검증은 여전히
# main/develop 둘 다 대상이다 — PR은 CD와 무관한 별개 게이트라 워크플로 하나로 충분하다.
name: Backend CI

on:
  push:
    branches: [ "develop" ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  workflow_call:  # 필요하면 다른 워크플로우가 게이트로 재사용할 수 있게 남겨둠 (현재 호출하는 곳 없음)
  workflow_dispatch:  # Actions 탭에서 수동 실행 가능

# 같은 브랜치/PR에 새 커밋이 올라오면 이전 실행은 취소해 러너 낭비를 막습니다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 이 워크플로우 내의 모든 run 명령어의 기본 실행 위치를 backend 폴더로 고정합니다.
    defaults:
      run:
        working-directory: ./backend

    env:
      # SQLite 인메모리로 테스트가 도니 실제 DB는 필요 없다. Settings.database_url이
      # 필수 필드라 형식만 유효한 더미 값을 준다(app/database.py의 create_engine이
      # import 시점에 호출되지만 실제 연결은 첫 사용 시점에야 일어난다).
      METROTRIP_DATABASE_URL: mysql+pymysql://ci:ci@localhost:3306/metrotrip_ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # backend/Dockerfile과 같은 버전을 쓴다. 어긋나면
          # CI가 통과한 코드가 배포에서 다르게 돈다.
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pyproject.toml의 dev extra가 pytest/ruff/httpx 버전을 고정한다.
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests with pytest
        run: pytest
