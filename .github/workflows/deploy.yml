# 비활성화 (2026-08-11). 프론트가 Vite 정적 SPA에서 Next.js SSR로 바뀌면서
# (develop의 "Vite 프론트를 Next.js로 전환" 커밋) 이 워크플로우는 두 가지 이유로 더 이상 못 쓴다.
#   1) 프론트·백엔드 모두 Docker로 배포하는 방향으로 정했다 (docs/CICD.md).
#   2) 그것과 별개로, 지금 frontend는 next.config.ts의 rewrites()로 /api/v1/*를
#      서버에서 백엔드로 프록시하고 app/page.tsx 등이 `force-dynamic`으로 매 요청마다
#      서버에서 fetch한다 — 즉 Node 서버가 떠 있어야 동작하는 SSR 앱이라, 정적 파일만
#      올리는 GitHub Pages로는 애초에 배포가 불가능하다.
# 코드는 되돌릴 일에 대비해 남겨두되(이제 npm run build도 `dist/`가 아니라 `.next/`를
# 만들어서 그대로 되살려도 그냥은 안 돌아간다 — 참고용), push 트리거를 지워 더 이상
# 자동으로는 돌지 않는다. 수동 실행(workflow_dispatch)만 가능한 상태다.
#
# 예전 사전 준비 기록 (Vite SPA 시절, 참고용):
#   1) Settings > Pages > Build and deployment > Source 를 "GitHub Actions" 로 변경
#   2) Settings > Secrets and variables > Actions > New repository secret 로
#      VITE_KAKAO_MAP_KEY 등록 (카카오 JavaScript 키)
#   3) 카카오 개발자 콘솔의 [JavaScript SDK 도메인]에
#      https://lellon0403.github.io 등록
name: Deploy to GitHub Pages (비활성)

on:
  # push 트리거 제거됨 — Next.js SSR 전환 + Docker 배포로 전환 (docs/CICD.md).
  # 수동 실행만 가능하게 남겨둔다.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 최신 것만 남긴다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          # .env 는 저장소에 없으므로 Secret 에서 주입한다.
          # 비어 있으면 빌드는 성공하지만 지도가 뜨지 않는다.
          VITE_KAKAO_MAP_KEY: ${{ secrets.VITE_KAKAO_MAP_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
