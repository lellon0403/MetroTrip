# main CD 파이프라인. develop은 CI만(ci-backend.yml/ci-frontend.yml), main은 테스트 →
# Docker 이미지 빌드 → Docker Hub push까지 — 여기까지가 GitHub Actions의 역할이다. 이미지를
# pull해서 실제로 컨테이너를 올리는(재)배포는 서버에서 한다(docs/CICD.md 7장) — 이
# 워크플로우는 그 부분을 다루지 않는다.
#
# self-hosted runner가 필요 없다. "이미지를 만들어서 registry에 올린다"까지만 하므로
# GitHub이 제공하는 ubuntu-latest에서 전부 끝난다.
#
# test-backend/test-frontend를 ci-backend.yml/ci-frontend.yml의 workflow_call로 재사용하지
# 않고 이 파일 안에 그대로 인라인했다 — main 파이프라인이 develop CI 파일의 변경에 영향받지
# 않고 독립적으로 동작하게 하기 위해서다. 대신 두 파일이 갈라지지 않도록 backend/frontend
# 쪽 검증 스텝을 고치면 양쪽 다 같이 봐야 한다.
#
# 필요한 저장소 설정 (Settings > Secrets and variables > Actions):
#   Variables — DOCKERHUB_USERNAME(Docker Hub 로그인 계정명),
#               DOCKERHUB_NAMESPACE(이미지 태그 앞에 붙는 네임스페이스. 로그인 계정과
#               다를 수 있어 별도로 뒀다 — 팀원 계정을 쓰기로 해서 하드코딩하지 않는다)
#               NEXT_PUBLIC_KAKAO_JS_KEY(카카오 JavaScript 키, frontend 이미지 빌드 시
#               클라이언트 번들에 박힘 — 비밀이 아니라 클라이언트에 노출되는 값이라 Variable)
#   Secrets   — DOCKERHUB_TOKEN(비밀번호 아님, Docker Hub Access Token)
name: Test and publish Docker images

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Actions 탭에서 수동 실행 가능

# main에 짧은 시간에 커밋이 연달아 올라오면 이전 실행은 취소한다 — 어차피 최신 커밋의
# 이미지만 의미가 있다. 진행 중이던 push가 취소돼도 레지스트리에는 그때까지 올라간
# 레이어만 남고, 다음 실행이 나머지를 이어 올리므로 이미지가 깨지지 않는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      # 실제 DB 접속은 안 한다 — Settings.database_url이 필수 필드라 형식만 유효한
      # 더미 값을 준다. 테스트는 전부 자체 인메모리 SQLite 엔진을 만들어 쓴다.
      METROTRIP_DATABASE_URL: sqlite:///./ci.db

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check .

  test-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  publish:
    needs:
      - test-backend
      - test-frontend

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_NAMESPACE }}/metrotrip-backend:main
            ${{ vars.DOCKERHUB_NAMESPACE }}/metrotrip-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          build-args: |
            API_INTERNAL_BASE_URL=http://api:8000
            NEXT_PUBLIC_KAKAO_JS_KEY=${{ vars.NEXT_PUBLIC_KAKAO_JS_KEY }}
          tags: |
            ${{ vars.DOCKERHUB_NAMESPACE }}/metrotrip-frontend:main
            ${{ vars.DOCKERHUB_NAMESPACE }}/metrotrip-frontend:${{ github.sha }}
