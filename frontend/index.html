<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetroTrip — 지하철 역 주변 관광 추천</title>
    <!-- Stitch 디자인 폰트 (Hanken Grotesk / Inter / JetBrains Mono) + Material Symbols 아이콘 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Hanken+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
    />
    <!--
      카카오맵 SDK.
      %VITE_KAKAO_MAP_KEY% 는 Vite가 빌드 시 .env 값으로 치환한다.
      autoload=false 로 두고 kakao.maps.load() 안에서 초기화한다 (로드 완료 시점 보장).
      libraries=services 는 주변 장소 검색(Places)에 필요하다.
    -->
    <script
      src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=%VITE_KAKAO_MAP_KEY%&libraries=services&autoload=false"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
