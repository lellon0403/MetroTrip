[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "metrotrip-api"
version = "0.1.0"
description = "MetroTrip Codex Version API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.15,<2",
  "argon2-cffi>=23.1,<26",
  "boto3>=1.37,<2",
  "cryptography>=44,<47",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "geoalchemy2>=0.17,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<7",
  "sqlalchemy>=2.0.38,<3",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.11,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"../../db/import/*.py" = ["E402"]
"../../db/seed/*.py" = ["E402"]
"../../db/migrations/versions/*.py" = ["E501"]
